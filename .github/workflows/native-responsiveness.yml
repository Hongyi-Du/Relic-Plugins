name: Native responsiveness
run-name: Native responsiveness - ${{ github.ref_name }} - ${{ inputs.mode || 'candidate' }} - ${{ inputs.client || 'both' }} - ${{ inputs.phase || 'all' }}${{ inputs.diagnostic && ' - diagnostic only' || '' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Label the same strict measurement as baseline or candidate
        type: choice
        options: [baseline, candidate]
        default: candidate
      diagnostic:
        description: Observe 30 seconds after the first failure; always fails and cannot count as acceptance
        type: boolean
        default: false
      phase:
        description: Focus one phase for feedback; only all can satisfy complete acceptance
        type: choice
        options: [all, open-every-chat, switch-chats, idle, workflows, history, monkey]
        default: all
      client:
        description: Choose a client for feedback; final acceptance still requires both platforms
        type: choice
        options: [both, windows, macos]
        default: both
  push:
    branches: [native-apps, native-macos]
    paths:
      - 'native/**'
      - 'scripts/performance/**'
      - '.github/workflows/native-responsiveness.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test synthetic scale, real paging, and fixed resource gates
        run: python -m unittest discover -s scripts/performance -p 'test_*.py' -v
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.client == 'both' || inputs.client == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [large, person-shape]
    concurrency:
      group: native-responsiveness-windows-${{ matrix.profile }}-${{ github.ref_name }}-${{ inputs.mode || 'candidate' }}-${{ inputs.phase || 'all' }}-${{ inputs.diagnostic && 'diagnostic' || 'acceptance' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Microsoft managed stack tool for diagnostic runs only
        if: ${{ inputs.diagnostic == true }}
        run: dotnet tool install dotnet-stack --tool-path native-build/diagnostics --version '8.*'
      - name: Build native UI stack helper for diagnostic runs only
        if: ${{ inputs.diagnostic == true }}
        run: |
          cmake -S native/windows/Relic.Diagnostics -B native-build/diagnostics-native -A x64
          cmake --build native-build/diagnostics-native --config Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psutil
      - name: Build the native client
        run: dotnet publish native/windows/Relic/Relic.csproj -c Release -p:Platform=x64 -o native-build/performance-windows
      - name: Prepare the isolated CI desktop
        run: ./scripts/visual/windows-display.ps1
      - name: Keep a full dump if the native client crashes
        # A stowed WinUI exception leaves only an exit code; the dump is analysed
        # on this runner after a failure and is never uploaded.
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Relic.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:GITHUB_WORKSPACE\performance\crash-dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
      - name: Measure exhaustive and seeded interaction against synthetic large data
        env:
          RELIC_PERF_DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
          RELIC_PERF_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'all' }}
          RELIC_DOTNET_STACK: ${{ github.workspace }}/native-build/diagnostics/dotnet-stack.exe
          RELIC_NATIVE_STACK: ${{ github.workspace }}/native-build/diagnostics-native/Release/Relic.NativeStack.exe
        run: |
          $diagnosticArgs = @()
          if ($env:RELIC_PERF_DIAGNOSTIC -eq 'true') { $diagnosticArgs += '--diagnostic' }
          $phaseArgs = @()
          if ($env:RELIC_PERF_PHASE -ne 'all') { $phaseArgs += @('--phase', $env:RELIC_PERF_PHASE) }
          python -X utf8 scripts/performance/run.py --client windows --exe native-build/performance-windows/Relic.exe --output performance/windows --profile ${{ matrix.profile }} --mode ${{ inputs.mode || 'candidate' }} @diagnosticArgs @phaseArgs
      - name: Resolve retained native frames with matching Microsoft symbols after measurement
        if: ${{ always() && inputs.diagnostic == true }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          Get-ChildItem performance/windows -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'stacks') } | ForEach-Object {
            python -X utf8 scripts/performance/resolve_symbols.py --exe native-build/diagnostics-native/Release/Relic.NativeStack.exe --output $_.FullName
          }
      - name: Record Windows crash reports and analyse crash dumps after a failure
        if: ${{ failure() }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          New-Item -ItemType Directory -Force performance/windows | Out-Null
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue |
            Where-Object { ($_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting')) -and ($_.Message -match 'Relic') } |
            Select-Object -First 20 | ForEach-Object { "[$($_.TimeCreated.ToString('o'))] $($_.ProviderName) $($_.Id)`n$($_.Message)`n" } |
            Out-File -Encoding utf8 performance/windows/crash-events.txt
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) { "cdb.exe is not installed on this runner" | Out-File -Encoding utf8 performance/windows/crash-analysis-unavailable.txt }
          # Windows Error Reporting may still be writing a full dump; wait until
          # WerFault has exited and the file size has stopped changing.
          for ($i = 0; $i -lt 60 -and (Get-Process WerFault -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 2 }
          Get-ChildItem performance/crash-dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 2 | ForEach-Object {
            $size = -1
            for ($i = 0; $i -lt 30 -and $size -ne (Get-Item $_.FullName).Length; $i++) { $size = (Get-Item $_.FullName).Length; Start-Sleep -Seconds 2 }
            "dump $($_.Name) bytes $size" | Out-File -Encoding utf8 -Append performance/windows/crash-events.txt
            if (Test-Path $cdb) {
              & $cdb -z $_.FullName -c '.symfix c:\symcache; .reload; !analyze -v; .ecxr; kb 40; q' 2>&1 |
                Out-File -Encoding utf8 (Join-Path 'performance/windows' ($_.BaseName + '-analyze.txt'))
            }
          }
          # Name the faulting function from the event even without a usable dump:
          # open the faulting image itself in cdb and look the offset up.
          $fault = Get-Content performance/windows/crash-events.txt -ErrorAction SilentlyContinue | Out-String
          if ((Test-Path $cdb) -and $fault -match 'Fault offset: (0x[0-9a-fA-F]+)' ) {
            $offset = $Matches[1]
            if ($fault -match 'Faulting module path: (.+\.dll)') {
              $image = $Matches[1].Trim(); $module = [IO.Path]::GetFileNameWithoutExtension($image) -replace '\.', '_'
              & $cdb -z $image -c ".symfix c:\symcache; .reload /f; ln $module+$offset; u $module+$offset L8; q" 2>&1 |
                Out-File -Encoding utf8 performance/windows/crash-fault-symbol.txt
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-responsiveness-Windows-${{ matrix.profile }}-${{ inputs.mode || 'candidate' }}${{ inputs.diagnostic && '-diagnostic' || '' }}
          path: |
            performance/windows
            !performance/windows/**/symbol-cache/**
          # Symbol caches can be large; retain the exact identities, resolved
          # frames and original stacks, not downloaded Microsoft PDB binaries.
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.client == 'both' || inputs.client == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [large, person-shape]
    concurrency:
      group: native-responsiveness-macos-${{ matrix.profile }}-${{ github.ref_name }}-${{ inputs.mode || 'candidate' }}-${{ inputs.phase || 'all' }}-${{ inputs.diagnostic && 'diagnostic' || 'acceptance' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psutil
      - run: swift build --package-path native/macos -c release --arch arm64
      - run: python3 scripts/package.py --platform macos --native-build native/macos/.build/arm64-apple-macosx/release --output native-build/performance-macos
      - name: Measure exhaustive and seeded interaction against synthetic large data
        shell: bash
        env:
          RELIC_PERF_DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
          RELIC_PERF_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'all' }}
        run: |
          diagnostic_args=()
          if [[ "$RELIC_PERF_DIAGNOSTIC" == "true" ]]; then diagnostic_args+=(--diagnostic); fi
          phase_args=()
          if [[ "$RELIC_PERF_PHASE" != "all" ]]; then phase_args+=(--phase "$RELIC_PERF_PHASE"); fi
          for binary in native-build/performance-macos/*/Relic.app/Contents/MacOS/Relic; do
            python3 scripts/performance/run.py --client macos --exe "$binary" --output performance/macos --profile '${{ matrix.profile }}' --mode '${{ inputs.mode || 'candidate' }}' "${diagnostic_args[@]}" "${phase_args[@]}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-responsiveness-macOS-${{ matrix.profile }}-${{ inputs.mode || 'candidate' }}${{ inputs.diagnostic && '-diagnostic' || '' }}
          path: performance/macos
