name: Recompare immutable native captures
run-name: Recompare capture run ${{ inputs.capture_run_id }} with ${{ github.sha }}
on:
  workflow_call:
    inputs:
      capture_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: Existing complete capture workflow run in this repository
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  element-checker:
    uses: ./.github/workflows/native-element-checks.yml
  compare:
    runs-on: ubuntu-latest
    continue-on-error: true # Amendment 5: retained appearance evidence is report-only
    needs: element-checker
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Read every original capture artifact without repeating UI capture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: python scripts/visual/download_comparison_inputs.py --run-id "$CAPTURE_RUN_ID" --output visual --report-output visual/parity --report-output visual/comparisons
      - name: Record source and comparison revisions separately
        if: always()
        env:
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('visual/raw-artifacts.json')
          receipt = json.loads(source.read_text(encoding='utf-8')) if source.is_file() else {}
          provenance = {
              'capture_run_id': os.environ['CAPTURE_RUN_ID'],
              'comparison_run_id': os.environ['GITHUB_RUN_ID'],
              'comparison_commit': os.environ['GITHUB_SHA'],
              'capture_commits': sorted({row['workflow_run']['head_sha'] for row in receipt.get('artifacts', [])}),
              'new_app_capture': False,
              'matrix': 'full',
              'scope': 'Recompare unchanged archived element measurements and PNGs; this does not validate the newer app binary.'}
          for folder in ('visual/parity', 'visual/comparisons'):
              Path(folder).mkdir(parents=True, exist_ok=True)
              (Path(folder) / 'comparison-provenance.json').write_text(json.dumps(provenance, indent=2), encoding='utf-8')
          PY
          df -h .
          du -sh visual/*
      - run: python scripts/visual/compose.py --source visual --output visual/comparisons
        if: always()
        continue-on-error: true
      - name: Publish the complete element regression report
        if: always()
        run: python scripts/visual/element_parity.py --source visual --reference-root visual/reference --macos-reference-root visual/reference-macos --output visual/parity --matrix full --report-only
      - name: Record actual final report storage
        if: always()
        run: |
          df -h .
          du -sh visual/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-native-element-parity
          path: visual/parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-native-visual-comparisons
          path: visual/comparisons
