name: Native visual review
on:
  push:
    branches: [native-apps, native-macos]
    paths:
      - '.github/workflows/native-visual.yml'
      - 'scripts/visual/**'
      - 'native/windows/**'
      - 'native/macos/**'
  workflow_dispatch:
    inputs:
      matrix:
        description: Full acceptance matrix or fast first-look scenes
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/visual/capture.py --client reference --matrix ${{ inputs.matrix || 'smoke' }} --output visual/reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reference
          path: visual/reference
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: dotnet publish native/windows/Relic/Relic.csproj -c Release -p:Platform=x64 -o native-build/windows
      - run: python -X utf8 scripts/visual/capture.py --client windows --exe native-build/windows/Relic.exe --matrix ${{ inputs.matrix || 'smoke' }} --output visual/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-windows
          path: visual/windows
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: swift build --package-path native/macos -c release --arch arm64
      - run: python3 scripts/package.py --platform macos --native-build native/macos/.build/arm64-apple-macosx/release --output native-build/visual-macos
      - shell: bash
        run: |
          for binary in native-build/visual-macos/*/Relic.app/Contents/MacOS/Relic; do
            python3 scripts/visual/capture.py --client macos --exe "$binary" --matrix ${{ inputs.matrix || 'smoke' }} --output visual/macos
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-macos
          path: visual/macos
  compare:
    needs: [reference, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - uses: actions/download-artifact@v4
        with:
          name: visual-reference
          path: visual/reference
      - uses: actions/download-artifact@v4
        with:
          name: visual-windows
          path: visual/windows
      - uses: actions/download-artifact@v4
        with:
          name: visual-macos
          path: visual/macos
      - run: python scripts/visual/compose.py --source visual --output visual/comparisons
      - uses: actions/upload-artifact@v4
        with:
          name: Relic-native-visual-comparisons
          path: visual/comparisons
