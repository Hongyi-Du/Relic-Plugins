name: Native visual review
on:
  push:
    branches: [native-apps, native-macos]
    paths:
      - '.github/workflows/native-visual.yml'
      - 'scripts/visual/**'
      - 'native/windows/**'
      - 'native/macos/**'
  workflow_dispatch:
    inputs:
      matrix:
        description: Full acceptance matrix or fast first-look scenes
        type: choice
        options: [smoke, full]
        default: full
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  element-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Check reference extractor syntax without opening a browser
        run: node --check scripts/visual/reference-elements.js
      - name: Test strict matcher thresholds and failure coverage
        run: python -m unittest discover -s scripts/visual -p 'test_*.py' -v
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix != 'smoke' && '[{"lang":"zh-CN","theme":"light"},{"lang":"zh-CN","theme":"dark"},{"lang":"en-US","theme":"light"},{"lang":"en-US","theme":"dark"}]' || '[{"lang":"zh-CN","theme":"light"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow playwright
      - run: python -m playwright install chromium
      - run: dotnet publish native/windows/Relic/Relic.csproj -c Release -p:Platform=x64 -o native-build/windows
      - run: dotnet publish native/windows/Relic.Capture/Relic.Capture.csproj -c Release -o native-build/capture
      - name: Set CI desktop size without a settings window
        run: |
          Set-TimeZone -Id UTC
          ./scripts/visual/windows-display.ps1
      - run: python -X utf8 scripts/visual/capture.py --client windows --reference --exe native-build/windows/Relic.exe --uia-exe native-build/capture/Relic.Capture.exe --matrix ${{ inputs.matrix || 'full' }} --lang ${{ matrix.lang }} --theme ${{ matrix.theme }} --output visual/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-windows-${{ matrix.lang }}-${{ matrix.theme }}
          path: visual/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-windows-${{ matrix.lang }}-${{ matrix.theme }}
          path: visual/reference
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix != 'smoke' && '[{"lang":"zh-CN","theme":"light"},{"lang":"zh-CN","theme":"dark"},{"lang":"en-US","theme":"light"},{"lang":"en-US","theme":"dark"}]' || '[{"lang":"zh-CN","theme":"light"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow playwright
      - run: python -m playwright install chromium
      - run: swift build --package-path native/macos -c release --arch arm64
      - run: python3 scripts/package.py --platform macos --native-build native/macos/.build/arm64-apple-macosx/release --output native-build/visual-macos
      - shell: bash
        run: |
          for binary in native-build/visual-macos/*/Relic.app/Contents/MacOS/Relic; do
            python3 scripts/visual/capture.py --client macos --reference --exe "$binary" --matrix ${{ inputs.matrix || 'full' }} --lang ${{ matrix.lang }} --theme ${{ matrix.theme }} --output visual/macos
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-macos-${{ matrix.lang }}-${{ matrix.theme }}
          path: visual/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-macos-${{ matrix.lang }}-${{ matrix.theme }}
          path: visual/reference-macos
  compare:
    needs: [windows, macos, element-checker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: reference-windows-*
          merge-multiple: true
          path: visual/reference
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: reference-macos-*
          merge-multiple: true
          path: visual/reference-macos
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: visual-windows-*
          merge-multiple: true
          path: visual/windows
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: visual-macos-*
          merge-multiple: true
          path: visual/macos
      - run: python scripts/visual/compose.py --source visual --output visual/comparisons
        continue-on-error: true
      - name: Require all 504 scenes to have zero element mismatches
        if: always()
        run: python scripts/visual/element_parity.py --source visual --reference-root visual/reference --macos-reference-root visual/reference-macos --output visual/parity --matrix full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-native-element-parity
          path: visual/parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-native-visual-comparisons
          path: visual/comparisons
