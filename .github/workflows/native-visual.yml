name: Native visual review
run-name: ${{ inputs.capture_run_id && 'Recompare immutable capture run' || inputs.matrix == 'paint' && 'Browser paint diagnostics only' || 'Native visual review' }} - ${{ github.ref_name }} - ${{ inputs.capture_run_id || inputs.matrix || 'smoke' }}
on:
  push:
    branches: [native-apps, native-macos]
    paths:
      - '.github/workflows/native-visual.yml'
      - 'scripts/visual/**'
      - 'native/windows/**'
      - 'native/macos/**'
  workflow_dispatch:
    inputs:
      matrix:
        description: Appearance regression report: full matrix, smoke scenes, or paint diagnostics
        type: choice
        options: [smoke, full, paint]
        default: smoke
      capture_run_id:
        description: Optional existing capture run to recompare; leaves every original measurement unchanged
        type: string
        default: ''
      paint_archive_run_id:
        description: In paint mode only, decode an existing browser SKP artifact without starting any app or browser
        type: string
        default: ''
      paint_producer_smb_mib:
        description: In paint mode only, producer SMB hypothesis; 0 unchanged or one 16 MiB comparison
        type: choice
        options: ['0', '16']
        default: '0'
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref_name }}-${{ inputs.capture_run_id || inputs.paint_archive_run_id || inputs.matrix || 'smoke' }}
  cancel-in-progress: false
jobs:
  archive-compare:
    if: ${{ inputs.capture_run_id != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-recompare.yml
    with:
      capture_run_id: ${{ inputs.capture_run_id }}
  paint-diagnostics:
    if: ${{ !inputs.capture_run_id && github.event_name == 'workflow_dispatch' && inputs.matrix == 'paint' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-paint-diagnostics.yml
    with:
      language: en-US
      theme: light
      archive_run_id: ${{ inputs.paint_archive_run_id || '' }}
      producer_smb_mib: ${{ inputs.paint_producer_smb_mib || '0' }}
  element-checker:
    if: ${{ !inputs.capture_run_id && inputs.matrix != 'paint' }}
    uses: ./.github/workflows/native-element-checks.yml
  windows:
    if: ${{ !inputs.capture_run_id && inputs.matrix != 'paint' }}
    runs-on: windows-2025
    continue-on-error: true # Appearance evidence is report-only under Amendment 5
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Keep runner capacity for builds and contract checks without removing
      # any of the twelve required Windows capture shards.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.matrix == 'full' && '[{"lang":"zh-CN","theme":"light","viewport":"1440x900"},{"lang":"zh-CN","theme":"light","viewport":"1280x800"},{"lang":"zh-CN","theme":"light","viewport":"1024x700"},{"lang":"zh-CN","theme":"dark","viewport":"1440x900"},{"lang":"zh-CN","theme":"dark","viewport":"1280x800"},{"lang":"zh-CN","theme":"dark","viewport":"1024x700"},{"lang":"en-US","theme":"light","viewport":"1440x900"},{"lang":"en-US","theme":"light","viewport":"1280x800"},{"lang":"en-US","theme":"light","viewport":"1024x700"},{"lang":"en-US","theme":"dark","viewport":"1440x900"},{"lang":"en-US","theme":"dark","viewport":"1280x800"},{"lang":"en-US","theme":"dark","viewport":"1024x700"}]' || '[{"lang":"zh-CN","theme":"light","viewport":"1440x900"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow playwright
      - run: python -m playwright install chromium
      - run: dotnet publish native/windows/Relic/Relic.csproj -c Release -p:Platform=x64 -o native-build/windows
      - run: dotnet publish native/windows/Relic.Capture/Relic.Capture.csproj -c Release -o native-build/capture
      - name: Set CI desktop size without a settings window
        run: |
          Set-TimeZone -Id UTC
          ./scripts/visual/windows-display.ps1
      - run: python -X utf8 scripts/visual/capture.py --client windows --reference --exe native-build/windows/Relic.exe --uia-exe native-build/capture/Relic.Capture.exe --matrix ${{ inputs.matrix || 'smoke' }} --lang ${{ matrix.lang }} --theme ${{ matrix.theme }} --viewport ${{ matrix.viewport }} --output visual/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-windows-${{ matrix.lang }}-${{ matrix.theme }}-${{ matrix.viewport }}
          path: visual/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-windows-${{ matrix.lang }}-${{ matrix.theme }}-${{ matrix.viewport }}
          path: visual/reference
  macos:
    if: ${{ !inputs.capture_run_id && inputs.matrix != 'paint' }}
    runs-on: macos-15
    continue-on-error: true # Native builds/tests have a separate required workflow
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Retain every shard while leaving runner capacity for native builds
      # and focused diagnostics during concurrent client development.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.matrix == 'full' && '[{"lang":"zh-CN","theme":"light"},{"lang":"zh-CN","theme":"dark"},{"lang":"en-US","theme":"light"},{"lang":"en-US","theme":"dark"}]' || '[{"lang":"zh-CN","theme":"light"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow playwright
      - run: python -m playwright install chromium
      - run: swift build --package-path native/macos -c release --arch arm64
      - run: python3 scripts/package.py --platform macos --native-build native/macos/.build/arm64-apple-macosx/release --output native-build/visual-macos
      - shell: bash
        run: |
          for binary in native-build/visual-macos/*/Relic.app/Contents/MacOS/Relic; do
            python3 scripts/visual/capture.py --client macos --reference --exe "$binary" --matrix ${{ inputs.matrix || 'smoke' }} --lang ${{ matrix.lang }} --theme ${{ matrix.theme }} --output visual/macos
          done
      - name: Retain actual macOS capture crash reports after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-macos-crash-reports-${{ matrix.lang }}-${{ matrix.theme }}
          if-no-files-found: warn
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-macos-${{ matrix.lang }}-${{ matrix.theme }}
          path: visual/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-macos-${{ matrix.lang }}-${{ matrix.theme }}
          path: visual/reference-macos
  compare:
    needs: [windows, macos, element-checker]
    if: always() && inputs.matrix != 'paint' && !inputs.capture_run_id
    runs-on: ubuntu-latest
    continue-on-error: true # Retain failed/missing extraction as regression findings
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Download every capture artifact with bounded local storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/visual/download_comparison_inputs.py --output visual --report-output visual/parity --report-output visual/comparisons
      - name: Record actual comparison storage before reports
        if: always()
        run: |
          df -h .
          du -sh visual/*
      - run: python scripts/visual/compose.py --source visual --output visual/comparisons
        continue-on-error: true
      - name: Publish element differences as a non-blocking regression report
        if: always()
        run: python scripts/visual/element_parity.py --source visual --reference-root visual/reference --macos-reference-root visual/reference-macos --output visual/parity --matrix ${{ inputs.matrix || 'smoke' }} --report-only
      - name: Record actual comparison storage after reports
        if: always()
        run: |
          df -h .
          du -sh visual/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-native-element-parity
          path: visual/parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relic-native-visual-comparisons
          path: visual/comparisons
