<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="relic-token" content="{{TOKEN}}">
<meta name="theme-color" content="#F8F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
<title>Relic</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="appbar" id="appbar" aria-label="窗口栏"></header>
<div id="app" class="app">
  <aside class="side" aria-label="组织和联系人">
    <div class="side-tools">
      <button class="nav-item" id="btn-new-org" type="button"></button>
      <label class="searchbox"><span id="search-icon"></span><input id="search" type="search" placeholder="搜索组织和成员" autocomplete="off"></label>
    </div>
    <nav class="tree" id="tree" aria-label="组织"></nav>
    <div class="side-foot">
      <button class="me" id="me" type="button" title="个人资料和设置"></button>
      <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置"></button>
    </div>
  </aside>
  <main class="chat" aria-label="聊天">
    <header class="chat-head" id="chat-head"></header>
    <div id="banner"></div>
    <div class="stream" id="stream" tabindex="0"><div class="stream-inner" id="stream-inner"></div></div>
    <div class="composer" id="composer"></div>
  </main>
  <aside class="panel" id="panel" aria-label="右侧栏"></aside>
</div>
<div id="layer"></div>
<script src="/static/app.js"></script>
</body>
</html>
