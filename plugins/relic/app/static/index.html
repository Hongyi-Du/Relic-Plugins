<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="relic-token" content="{{TOKEN}}">
<meta name="theme-color" content="#F8F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
<title>Relic</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- Words come from the person's language (app.js, loadLang): data-i18n names the text, data-i18n-<attribute> an attribute. -->
<header class="appbar" id="appbar" data-i18n-aria-label="page.titlebar"></header>
<div id="app" class="app">
  <aside class="side" data-i18n-aria-label="page.side">
    <div class="side-tools">
      <button class="nav-item" id="btn-new-org" type="button"></button>
      <label class="searchbox"><span id="search-icon"></span><input id="search" type="search" data-i18n-placeholder="page.search" autocomplete="off"></label>
    </div>
    <nav class="tree" id="tree" data-i18n-aria-label="page.tree"></nav>
    <div class="side-foot">
      <button class="me" id="me" type="button" data-i18n-title="page.me"></button>
      <button class="icon-btn" id="btn-settings" data-i18n-title="common.settings" data-i18n-aria-label="common.settings"></button>
    </div>
  </aside>
  <main class="chat" data-i18n-aria-label="page.chat">
    <header class="chat-head" id="chat-head"></header>
    <div id="banner"></div>
    <div class="stream" id="stream" tabindex="0"><div class="stream-inner" id="stream-inner"></div></div>
    <div class="composer" id="composer"></div>
  </main>
  <aside class="panel" id="panel" data-i18n-aria-label="page.panel"></aside>
</div>
<div id="layer"></div>
<script src="/static/app.js"></script>
</body>
</html>
